name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set +e  # runner bash runs with -e; keep going to report details
          pytest --tb=line -q > pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR)" pytest.log | head -10)
            echo "::error::Failing tests:%0A${summary//$'\n'/%0A}"
            tail_text=$(tail -c 900 pytest.log)
            echo "::error::pytest tail:%0A${tail_text//$'\n'/%0A}"
            exit $code
          fi

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
