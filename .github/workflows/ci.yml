name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # statuses: write is needed only by the temporary ci-diag diagnostics step.
    permissions:
      statuses: write
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set +e  # runner bash runs with -e; keep going to report details
          pytest --tb=line -q > pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR)" pytest.log | head -10)
            echo "::error::Failing tests:%0A${summary//$'\n'/%0A}"
            tail_text=$(tail -c 900 pytest.log)
            echo "::error::pytest tail:%0A${tail_text//$'\n'/%0A}"
            exit $code
          fi
      - name: Diagnostics (failing tests -> commit statuses)
        # TEMPORARY diagnostics: CI logs are not readable from the development
        # sandbox, but commit statuses are. Removed once the Windows failure
        # is diagnosed. Does not alter how tests run.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          grep -E "^(FAILED|ERROR)" pytest.log | head -15
          {
            echo "## Failing tests (${{ runner.os }})"
            grep -E "^(FAILED|ERROR)" pytest.log | head -15
            echo; echo '```'; tail -c 2000 pytest.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          i=0
          grep -E "^(FAILED|ERROR)" pytest.log | head -15 | while IFS= read -r line; do
            # (each posting is best-effort; failures surface in the job log)
            i=$((i+1))
            desc=$(printf '%s' "$line" | tr -d '\r' | cut -c1-140)
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -f state=failure \
              -f "context=ci-diag/${{ runner.os }}-$i" \
              -f "description=$desc" \
              -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || true
          done
          summary=$(tail -n 3 pytest.log | tr '\n' ' ' | tr -d '\r' | cut -c1-140)
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f "context=ci-diag/${{ runner.os }}-summary" \
            -f "description=$summary" \
            || true

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
