name: Publish

# PyPI Trusted Publishing: no tokens or secrets. Triggered ONLY by an actual
# GitHub Release publication event. Publishing is additionally gated by the
# protected `pypi` GitHub environment (user-controlled approval).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC); nothing else
      contents: read    # required by actions/checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate artifacts
        run: python -m twine check dist/*
      - name: Store artifacts for the release-assets job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    name: Attach wheel/sdist to the GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job; uploads release assets
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
