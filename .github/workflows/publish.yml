name: Publish

# PyPI Trusted Publishing: no tokens or secrets. Triggered ONLY by an actual
# GitHub Release publication event, and only for `v*` tags whose version
# exactly matches src/cuda_doctor/version.py. Publishing is additionally
# gated by the protected `pypi` GitHub environment (user-controlled approval).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC); nothing else
      contents: read    # required by actions/checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate artifacts
        run: python -m twine check dist/*
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pkg_version="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/cuda_doctor/version.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.MULTILINE)
          assert match, "cannot read __version__ from src/cuda_doctor/version.py"
          print(match.group(1))
          PY
          )"
          expected_tag="v${pkg_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$pkg_version'. Expected tag: '$expected_tag'."
            exit 1
          fi
          echo "Tag/version invariant satisfied: $RELEASE_TAG == $expected_tag"
      - name: Store artifacts for the release-assets job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    name: Attach wheel/sdist to the GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job; uploads release assets
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
